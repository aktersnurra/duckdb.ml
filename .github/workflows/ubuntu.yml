---
name: Ubuntu CI

"on":
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Pinned OxCaml validation
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: Install bootstrap prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            autoconf \
            bubblewrap \
            build-essential \
            patch \
            pkg-config \
            rsync \
            unzip

      - name: Install pinned opam
        run: |
          curl --fail --location --retry 3 \
            --output /tmp/opam \
            https://github.com/ocaml/opam/releases/download/2.5.2/opam-2.5.2-x86_64-linux
          printf '%s%s  /tmp/opam\n' \
            edfca2630c373b44b7ee1c2f81cd8dcf \
            67468d0db57d6c02158de553ac63dbd4 \
            | sha256sum --check --strict
          sudo install --mode 0755 /tmp/opam /usr/bin/opam
          opam --version

      - name: Enable Bubblewrap user namespaces
        run: |
          sudo sysctl --write kernel.unprivileged_userns_clone=1
          sudo sysctl --write kernel.apparmor_restrict_unprivileged_userns=0

      - name: Restore pinned OxCaml toolchain
        id: toolchain-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            _opam
            .local/opam
            .local/upstream
          key: ox-2.5.2-${{ hashFiles('tools/toolchain.lock.json') }}

      - name: Bootstrap pinned toolchain and DuckDB
        run: |
          python3 tools/bootstrap.py --check
          python3 tools/bootstrap.py --fetch
          python3 tools/bootstrap.py --install

      - name: Build and validate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .local/ci-logs

          ./tools/run build @all \
            2>&1 | tee .local/ci-logs/build.log
          python3 -m unittest \
            test.soak.test_run_soak \
            bench.test_benchmark_summary \
            tools.test_bootstrap \
            2>&1 | tee .local/ci-logs/python-tests.log
          ./tools/run runtest --force \
            2>&1 | tee .local/ci-logs/runtest.log

          ./tools/run exec --no-build examples/synchronous.exe \
            2>&1 | tee .local/ci-logs/example-synchronous.log
          ./tools/run exec --no-build examples/asynchronous.exe \
            2>&1 | tee .local/ci-logs/example-asynchronous.log
          ./tools/run exec --no-build examples/eio.exe \
            2>&1 | tee .local/ci-logs/example-eio.log

          bash test/install_adapters_smoke.sh \
            2>&1 | tee .local/ci-logs/package-smoke.log
          ./tools/run exec --no-build test/soak/test_soak_support.exe \
            2>&1 | tee .local/ci-logs/soak-support.log
          python3 test/soak/run_model_soak.py \
            --seed 104729 \
            --episodes 8 \
            --output .local/ci-logs/model-soak.log
          python3 test/soak/run_soak.py \
            --seed 104729 \
            --repetitions 1 \
            --output .local/ci-logs/selector-soak.log
          python3 bench/run_benchmarks.py \
            --correctness-only \
            --rows 1000 \
            --warmups 0 \
            --samples 1 \
            --output-dir .local/ci-logs/benchmark
          opam lint \
            duckdb-ffi.opam \
            duckdb.opam \
            duckdb-async.opam \
            duckdb-eio.opam \
            2>&1 | tee .local/ci-logs/opam-lint.log

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ubuntu-ci-logs-${{ github.run_id }}
          path: |
            .local/ci-logs
            _build/log
          if-no-files-found: ignore
          retention-days: 7
